<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notespice</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FFC107" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Notespice" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Trindle Sans is self-hosted under /fonts (see style.css @font-face) -
       no Google Fonts CDN, no request to Google at all. -->
</head>
<body>
  <!-- Login screen -->
  <div id="login-screen" class="screen" hidden>
    <form id="login-form" class="login-card">
      <div class="brand-lockup">
        <img src="/icons/icon-192.png" alt="" width="32" height="32" />
        <h1>Notespice</h1>
      </div>
      <label>
        Username
        <input type="text" id="login-username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <button type="submit">Log in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <!-- Main app -->
  <div id="app-screen" class="screen" hidden>
    <div id="sidebar-backdrop"></div>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/icons/icon-192.png" alt="" width="20" height="20" />
        <span>Notespice</span>
        <button id="pin-btn" class="pin-btn active" aria-label="Keep sidebar open" aria-pressed="true">
          <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H10L9.5 6.25L12 8.75V9.75H4V8.75L6.5 6.25Z"/><path d="M8 9.75L8 14.25"/></svg>
        </button>
      </div>
      <div class="sidebar-header">
        <input type="search" id="search-box" placeholder="Search notes…"
               aria-label="Search notes"
               />
      </div>
      <ul id="note-list"></ul>
      <div class="sidebar-footer-icons">
        <div class="export-note-wrap">
          <button id="export-note-btn" class="icon-btn" aria-label="Export this note" aria-haspopup="true" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.75H9.25L12 5.5V13.25A1 1 0 0 1 11 14.25H4A1 1 0 0 1 3 13.25V3.75A1 1 0 0 1 4 2.75Z"/><path d="M9 2.75V5.5H12"/><path d="M7.5 7.9V11.6"/><path d="M5.9 10L7.5 11.6L9.1 10"/></svg>
          </button>
          <div id="export-note-menu" class="export-menu" role="menu" hidden>
            <button type="button" class="export-menu-item" data-format="md" role="menuitem">Markdown (.md)</button>
            <button type="button" class="export-menu-item" data-format="pdf" role="menuitem">PDF</button>
          </div>
        </div>
        <button id="export-btn" class="icon-btn" aria-label="Export all notes">
          <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.75 4A1.25 1.25 0 0 1 3 2.75H6L7.5 4.25H13A1.25 1.25 0 0 1 14.25 5.5V12A1.25 1.25 0 0 1 13 13.25H3A1.25 1.25 0 0 1 1.75 12Z"/><path d="M8 6L8 11"/><path d="M5.75 9L8 11.25L10.25 9"/></svg>
        </button>
        <button id="import-btn" class="icon-btn" aria-label="Import notes">
          <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.75 12.5V4A1.25 1.25 0 0 1 3 2.75H6L7.5 4.25H12A1.25 1.25 0 0 1 13.25 5.5V6.5M1.75 12.5L3.5 7.5A1.25 1.25 0 0 1 4.7 6.75H14.2L12.5 12.5A1 1 0 0 1 11.5 13.25H2.5A.75.75 0 0 1 1.75 12.5Z"/></svg>
        </button>
        <input type="file" id="import-file-input" accept=".md,.zip" style="display:none" />
        <span class="sep"></span>
        <button id="logout-btn" class="icon-btn" aria-label="Log out">
          <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.25 2.25H4A1.25 1.25 0 0 0 2.75 3.5V12.5A1.25 1.25 0 0 0 4 13.75H9.25"/><path d="M6.5 8L14 8"/><path d="M11.25 5.25L14 8L11.25 10.75"/></svg>
        </button>
      </div>
      <div class="sidebar-footer-brand-row">
        <a id="version-link" class="version-link"
           href="https://notespice.org/changelog"
           target="_blank" rel="noopener"
          ></a>
        <a class="lightmorphic-badge" href="https://lightmorphic.com" target="_blank" rel="noopener noreferrer" translate="no">
          <span>Created by</span>
          <img src="/images/lightmorphic-dark-tb-250x50-sq.webp" alt="Lightmorphic" width="80" height="16" loading="lazy" />
          <span class="external-link-icon" aria-hidden="true">
            <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.75 2.75H13.25V7.25"/><path d="M13.25 2.75L7.5 8.5"/><path d="M11.5 9.5V12.75A1.5 1.5 0 0 1 10 14.25H3.75A1.5 1.5 0 0 1 2.25 12.75V6.5A1.5 1.5 0 0 1 3.75 5H7"/></svg>
          </span>
        </a>
      </div>
    </aside>

    <main class="editor-pane">
      <div id="empty-state" class="empty-state" hidden>
        <p style="margin:0;">No notes yet. Create one to get started.</p>
      </div>
      <div id="search-results" hidden></div>

      <div id="editor" class="editor" hidden>
        <div class="editor-toolbar">
          <button id="menu-toggle-btn" class="menu-toggle-btn" aria-label="Toggle sidebar">
            <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4L13.5 4"/><path d="M2.5 8L13.5 8"/><path d="M2.5 12L13.5 12"/></svg>
          </button>
          <img class="appbar-logo" src="/icons/icon-192.png" alt="" width="22" height="22" />
          <input type="text" id="title-input" placeholder="Untitled note" aria-label="Note title" />
          <div class="toolbar-right">
            <div class="undo-redo-group">
              <button id="undo-btn" class="icon-btn" aria-label="Undo">
                <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5H10.5A3.5 3.5 0 0 1 10.5 13.5H8"/><path d="M5.5 3.5L2.5 6.5L5.5 9.5"/></svg>
              </button>
              <button id="redo-btn" class="icon-btn" aria-label="Redo">
                <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 6.5H5.5A3.5 3.5 0 0 0 5.5 13.5H8"/><path d="M10.5 3.5L13.5 6.5L10.5 9.5"/></svg>
              </button>
            </div>
            <div class="mode-toggle">
              <button id="mode-wysiwyg" class="mode-btn active">Writer</button>
              <span class="mode-sep">/</span>
              <button id="mode-raw" class="mode-btn">Markdown</button>
            </div>
            <span id="save-indicator" class="save-indicator"></span>
            <button id="delete-btn" class="icon-btn danger" aria-label="Delete note">
              <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.25 4L13.75 4"/><path d="M6 4V2.75A1 1 0 0 1 7 1.75H9A1 1 0 0 1 10 2.75V4"/><path d="M3.75 4L4.5 13A1.4 1.4 0 0 0 5.9 14.25H10.1A1.4 1.4 0 0 0 11.5 13L12.25 4"/><path d="M6.75 7L6.75 11"/><path d="M9.25 7L9.25 11"/></svg>
            </button>
          </div>
        </div>
        <div id="format-bar" class="format-bar"></div>
        <p id="app-error" class="app-error" role="alert" hidden></p>
        <div id="wysiwyg-editor" class="wysiwyg-container" contenteditable="true"
             role="textbox" aria-multiline="true" aria-label="Note content"></div>
        <textarea id="raw-textarea" class="raw-textarea" aria-label="Markdown source" hidden></textarea>
        <!-- Filled just before a PDF export and printed in its place -
             a plain <textarea> doesn't paginate onto printed pages
             usefully, so PDF export always renders through this
             regardless of which mode (Writer/Markdown) is on screen. -->
        <div id="print-note" class="wysiwyg-container print-only"></div>
      </div>
    </main>

    <!-- Extended FAB: the primary action, reachable from anywhere -
         including on mobile without opening the drawer first. -->
    <button id="new-note-btn" class="fab">
      <svg aria-hidden="true" viewBox="0 0 16 16" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75H9.5L12.25 4.5V13A1.25 1.25 0 0 1 11 14.25H4A1.25 1.25 0 0 1 2.75 13V3A1.25 1.25 0 0 1 4 1.75Z"/><path d="M5 9.25L10 9.25"/><path d="M7.5 6.75L7.5 11.75"/></svg>
      <span>New note</span>
    </button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
