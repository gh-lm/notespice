<!doctype html><meta charset=utf-8><style>
@font-face { font-family: "Trindle Sans"; src: url("../../../static/fonts/TrindleSans-Variable.woff2") format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 360px; }
body {
  background: #1c1e26;
  font-family: "Trindle Sans", system-ui, sans-serif;
  color: #fafafa;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; gap: 56px;
  padding: 0 72px;
}
.glow { position: absolute; inset: 0; background:
  radial-gradient(620px 420px at 86% 14%, rgba(251,199,17,.20), transparent 68%),
  radial-gradient(520px 380px at 8% 92%, rgba(94,182,255,.10), transparent 70%); }
.mark { position: relative; width: 150px; height: 150px; border-radius: 34px;
  background: #fbc711; display: grid; place-items: center; flex: none;
  box-shadow: 0 18px 44px rgba(0,0,0,.5); }
.card { width: 84px; height: 108px; background: #fdfdf8; border-radius: 10px;
  transform: rotate(-8deg); box-shadow: 0 8px 18px rgba(120,86,0,.42); }
.words { position: relative; }
h1 { font-size: 78px; font-weight: 600; letter-spacing: -.025em; line-height: 1; }
p { font-size: 26px; color: #c2c2cc; margin-top: 14px; font-weight: 400; }
.chips { display: flex; gap: 10px; margin-top: 26px; }
.chip { font-size: 15px; font-weight: 600; padding: 8px 15px; border-radius: 999px;
  background: #282b34; border: 1px solid rgba(255,255,255,.12); color: #e3e3ea; }
.chip.on { background: #4b3c05; border-color: rgba(251,199,17,.45); color: #fde694; }
</style>
<div class=glow></div>
<div class=mark><div class=card></div></div>
<div class=words>
  <h1>Notespice</h1>
  <p>Markdown notes that stay yours. No database, no account, just files.</p>
  <div class=chips>
    <span class="chip on">One container</span>
    <span class=chip>Plain .md on disk</span>
    <span class=chip>Works offline</span>
    <span class=chip>GPL v3</span>
  </div>
</div>
